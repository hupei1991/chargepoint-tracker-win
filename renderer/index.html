<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>ChargePoint Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.2 1 3.5 9h3.8L6.6 15l5.9-8.2H8.6z"/></svg>
      <span data-i18n="appName">ChargePoint Tracker</span>
    </div>
    <div class="bar-actions">
      <button class="lang-btn" id="lang" data-i18n="langToggle" data-i18n-title="langToggleTitle"></button>
      <button class="icon-btn" id="refresh" data-i18n-title="refresh" data-i18n-label="refresh">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="hide" data-i18n-title="hide" data-i18n-label="hide">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="station">
      <h1 id="name"></h1>
      <p id="address" class="muted"></p>
    </section>

    <section class="ports" id="ports" role="radiogroup"></section>
    <p class="hint muted" id="hint" data-i18n="pickHint"></p>

    <section class="tracking">
      <div class="status-line">
        <span class="dot" id="dot"></span>
        <div>
          <p id="status-text"></p>
          <p id="status-sub" class="muted small"></p>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" id="primary"></button>
        <button class="btn ghost" id="stop" data-i18n="stop" disabled></button>
      </div>
    </section>
  </main>

  <footer class="settings">
    <form class="row" id="station-form" autocomplete="off">
      <label for="station-input" data-i18n="station"></label>
      <input id="station-input" inputmode="numeric" list="recent" spellcheck="false" data-i18n-placeholder="stationPlaceholder">
      <datalist id="recent"></datalist>
      <button class="btn small" type="submit" id="switch" data-i18n="switch"></button>
    </form>
    <div class="row">
      <label for="interval" data-i18n="interval"></label>
      <select id="interval">
        <option value="30" data-i18n="interval.30"></option>
        <option value="60" data-i18n="interval.60"></option>
        <option value="120" data-i18n="interval.120"></option>
        <option value="300" data-i18n="interval.300"></option>
      </select>
      <label class="switch" data-i18n-title="launchAtLoginHint">
        <input type="checkbox" id="login">
        <span class="track"><span class="thumb"></span></span>
        <span data-i18n="launchAtLogin"></span>
      </label>
    </div>
    <div class="row meta">
      <span class="muted small" id="checked"></span>
      <button class="link small" id="web" data-i18n="openWeb"></button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
